<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="AJI LAB의 자격·인증 및 교육 수료 기록입니다.">
  <meta name="color-scheme" content="light">
  <title>ABOUT | AJI LAB</title>
  <style>
    :root { --bg:#fafafa; --text:#222; --sub:#666; --light:#888; --line:#e8e8e8; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif; word-break:keep-all; }
    a { color:inherit; text-decoration:none; }
    a:focus-visible,button:focus-visible { outline:2px solid #444; outline-offset:4px; }
    header, main, footer { max-width:1000px; margin:auto; }
    header { padding:28px 24px; display:flex; justify-content:space-between; align-items:center; gap:24px; }
    .logo { font-weight:800; letter-spacing:1px; }
    nav { display:flex; gap:18px; flex-wrap:wrap; font-size:13px; color:#666; }
    nav a:hover, nav a[aria-current="page"] { color:#222; }
    nav a[aria-current="page"] { font-weight:700; }
    main { padding:0 24px 100px; }
    .hero { padding:100px 0 80px; }
    .eyebrow { margin:0 0 22px; color:#888; font-size:12px; font-weight:700; letter-spacing:2px; }
    h1 { margin:0 0 24px; font-size:clamp(42px,7vw,68px); line-height:1.18; letter-spacing:-2px; }
    .intro { margin:0; color:var(--sub); font-size:17px; line-height:1.8; }
    .section-heading { display:flex; justify-content:space-between; align-items:baseline; gap:20px; margin-bottom:22px; }
    .section-heading h2 { margin:0; font-size:24px; letter-spacing:-.5px; }
    .count { font-size:12px; color:var(--light); letter-spacing:1px; }
    .records { border:1px solid var(--line); border-radius:18px; background:#fff; overflow:hidden; }
    .record { display:flex; justify-content:space-between; align-items:center; gap:24px; min-height:132px; padding:28px 30px; }
    .record+.record { border-top:1px solid #ededed; }
    .record-main { min-width:0; }
    .meta { margin:0 0 9px; font-size:12px; color:var(--light); }
    .record h3 { margin:0 0 8px; font-size:19px; font-weight:700; line-height:1.4; }
    .issuer { margin:0; color:var(--sub); font-size:14px; }
    .view { flex-shrink:0; border:0; padding:10px 0; background:transparent; color:#333; font:inherit; font-size:13px; font-weight:600; white-space:nowrap; cursor:pointer; }
    .view:hover:not(:disabled) { text-decoration:underline; text-underline-offset:4px; }
    .view:disabled { color:#999; cursor:default; font-weight:400; }
    .note { color:#777; margin:20px 0 0; font-size:12px; line-height:1.8; }
    footer { padding:30px 24px 50px; border-top:1px solid var(--line); color:#888; font-size:13px; }
    dialog { border:0; border-radius:16px; padding:16px; width:min(92vw,900px); max-height:92vh; box-shadow:0 24px 80px #0004; }
    dialog::backdrop { background:#0009; }
    .modal-head { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:14px; }
    .modal-head h2 { margin:0; font-size:16px; }
    .close { background:#f1f1f1; color:#333; border:0; border-radius:8px; cursor:pointer; padding:9px 12px; font:inherit; font-size:13px; }
    #document-image { display:block; max-width:100%; max-height:calc(92vh - 106px); width:auto; height:auto; margin:auto; object-fit:contain; }
    @media (max-width:700px) {
      header { padding:22px 20px; align-items:flex-start; gap:14px; }
      nav { justify-content:flex-end; gap:10px 12px; font-size:11px; }
      main { padding:0 20px 75px; }
      .hero { padding:75px 0 65px; }
      .intro { font-size:15px; }
      .record { align-items:flex-start; flex-direction:column; gap:10px; padding:24px 22px; min-height:0; }
      .record h3 { font-size:18px; }
      .view { padding:7px 0; }
      footer { padding:30px 20px 45px; }
    }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; } }
  </style>
</head>
<body>
  <header>
    <a href="/" class="logo" aria-label="AJI LAB 홈">AJI LAB</a>
    <nav aria-label="주요 메뉴">
      <a href="/works/">WORKS</a>
      <a href="/ai/">AI &amp; DATA</a>
      <a href="/kids/">KIDS</a>
      <a href="/edu/">EDUCATION ADMIN</a>
      <a href="/about/" aria-current="page">ABOUT</a>
    </nav>
  </header>

  <main>
    <section class="hero" aria-labelledby="page-title">
      <p class="eyebrow">AJI LAB / ABOUT</p>
      <h1 id="page-title">공부하며 쌓은 것들</h1>
      <p class="intro">자격증과 인증서, 교육 수료 내역을 정리했습니다.</p>
    </section>

    <section aria-labelledby="record-title">
      <div class="section-heading">
        <h2 id="record-title">자격·인증 및 수료</h2>
        <span class="count">02 RECORDS</span>
      </div>

      <div class="records">
        <!-- 인증서 PNG는 /about/certificates/ai-champion-green.png 경로에 올리세요. -->
        <article class="record" data-image="certificates/ai-champion-green.png">
          <div class="record-main">
            <p class="meta">2026 · 인증</p>
            <h3>AI 챔피언 그린</h3>
            <p class="issuer">행정안전부</p>
          </div>
          <button class="view" type="button" disabled>이미지 등록 전</button>
        </article>

        <!-- 수료증 PNG는 /about/certificates/ai-champion-blue.png 경로에 올리세요. -->
        <article class="record" data-image="certificates/ai-champion-blue.png">
          <div class="record-main">
            <p class="meta">2026 · 인증</p>
            <h3>AI 챔피언 블루</h3>
            <p class="issuer">행정안전부</p>
          </div>
          <button class="view" type="button" disabled>이미지 등록 전</button>
        </article>
      </div>
      <p class="note">이 페이지는 개인 학습 기록입니다. 인증서 이미지는 개인정보를 가린 뒤 등록합니다.</p>
    </section>
  </main>

  <footer>© 2026 AJI LAB · 아지.kr · <a href="/">홈으로</a></footer>

  <dialog id="document-dialog" aria-labelledby="dialog-title">
    <div class="modal-head">
      <h2 id="dialog-title">인증서</h2>
      <button type="button" class="close" id="close-dialog">닫기 ×</button>
    </div>
    <img id="document-image" alt="">
  </dialog>

  <script>
    // 이미지가 실제 등록되었을 때에만 '인증서 보기'가 활성화됩니다.
    const viewer = document.getElementById('document-dialog');
    const viewerImage = document.getElementById('document-image');
    const viewerTitle = document.getElementById('dialog-title');
    const closeButton = document.getElementById('close-dialog');
    let previousFocus = null;

    document.querySelectorAll('.record[data-image]').forEach((record) => {
      const path = record.dataset.image;
      const button = record.querySelector('.view');
      const title = record.querySelector('h3').textContent.trim();
      const probe = new Image();

      probe.onload = () => {
        button.disabled = false;
        button.textContent = record.querySelector('.meta').textContent.includes('수료') ? '수료증 보기 ↗' : '인증서 보기 ↗';
        button.addEventListener('click', () => {
          previousFocus = button;
          viewerTitle.textContent = title;
          viewerImage.src = path;
          viewerImage.alt = title + ' 이미지';
          if (typeof viewer.showModal === 'function') viewer.showModal();
          else window.open(path, '_blank', 'noopener');
        });
      };
      probe.onerror = () => { button.disabled = true; button.textContent = '이미지 등록 전'; };
      probe.src = path;
    });

    function closeViewer() {
      viewer.close();
      viewerImage.removeAttribute('src');
      if (previousFocus) previousFocus.focus();
    }
    closeButton.addEventListener('click', closeViewer);
    viewer.addEventListener('click', (event) => { if (event.target === viewer) closeViewer(); });
    viewer.addEventListener('close', () => { viewerImage.removeAttribute('src'); if(previousFocus) previousFocus.focus(); });
  </script>
</body>
</html>
