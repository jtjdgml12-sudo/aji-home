<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AJI LAB | 아지</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Noto Sans KR", sans-serif;
      background: #fafafa;
      color: #222;
    }

    header {
      max-width: 1000px;
      margin: auto;
      padding: 28px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .domain {
      font-size: 14px;
      color: #777;
    }

    .hero {
      max-width: 1000px;
      margin: auto;
      padding: 100px 24px 80px;
    }

    .hero h1 {
      font-size: clamp(42px, 8vw, 76px);
      line-height: 1.1;
      margin-bottom: 24px;
    }

    .hero p {
      font-size: 19px;
      line-height: 1.7;
      color: #666;
    }

    .projects {
      max-width: 1000px;
      margin: auto;
      padding: 20px 24px 100px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .card {
      background: white;
      border: 1px solid #e8e8e8;
      border-radius: 18px;
      padding: 30px;
      min-height: 210px;
      transition: 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.06);
    }

    .card .type {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #999;
      margin-bottom: 22px;
    }

    .card h2 {
      font-size: 23px;
      margin-bottom: 12px;
    }

    .card p {
      color: #777;
      line-height: 1.6;
      font-size: 15px;
    }

    footer {
      max-width: 1000px;
      margin: auto;
      padding: 30px 24px 50px;
      color: #aaa;
      font-size: 13px;
    }

    @media (max-width: 700px) {
      .hero {
        padding-top: 70px;
      }

      .projects {
        grid-template-columns: 1fr;
      }

      .card {
        min-height: 170px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">AJI LAB</div>
  <div class="domain">아지.kr</div>
</header>

<section
